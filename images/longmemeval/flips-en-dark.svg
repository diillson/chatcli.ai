<svg xmlns="http://www.w3.org/2000/svg" width="760" height="262" viewBox="0 0 760 262" font-family="Inter, -apple-system, Segoe UI, sans-serif" role="img" aria-label="What happened to the 46 first-round misses">
<rect width="760" height="262" fill="#0E0F10"/>
<text x="24" y="34" font-size="18" font-weight="600" fill="#ededed">What happened to the 46 first-round misses</text>
<text x="24" y="56" font-size="13" fill="#bcbcc4">54 questions were wrong in at least one of the two rounds</text>
<text x="24" y="84" font-size="12" fill="#8b8b94">First round: 46 misses</text>
<rect x="24" y="92" width="270.0" height="44" rx="5" fill="#16a394"><title>27 fixed</title></rect><text x="159.0" y="119" font-size="13" font-weight="600" text-anchor="middle" fill="#0E0F10">27 fixed</text>
<rect x="297.0" y="92" width="190.0" height="44" rx="5" fill="#e05a45"><title>19 still wrong</title></rect><text x="392.0" y="119" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">19 still wrong</text>
<text x="24" y="150" font-size="12" fill="#8b8b94">Now: 27 misses</text>
<rect x="297.0" y="158" width="190.0" height="44" rx="5" fill="#e05a45"><title>19 still wrong</title></rect><text x="392.0" y="185" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">19 still wrong</text>
<rect x="490.0" y="158" width="80.0" height="44" rx="5" fill="#ededed"><title>8 new</title></rect><text x="530.0" y="185" font-size="13" font-weight="600" text-anchor="middle" fill="#0E0F10">8 new</text>
<text x="24" y="234" font-size="12" fill="#bcbcc4">fixed = wrong then, right now · new = right then, wrong now</text>
</svg>
