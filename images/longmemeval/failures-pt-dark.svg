<svg xmlns="http://www.w3.org/2000/svg" width="760" height="262" viewBox="0 0 760 262" font-family="Inter, -apple-system, Segoe UI, sans-serif" role="img" aria-label="Onde as 46 falhas aconteceram">
<rect width="760" height="262" fill="#0E0F10"/>
<text x="24" y="34" font-size="18" font-weight="600" fill="#ededed">Onde as 46 falhas aconteceram</text>
<text x="24" y="56" font-size="13" fill="#bcbcc4">A busca trouxe a evidência em 469 das 470 perguntas com resposta</text>
<text x="228" y="96" font-size="13" text-anchor="end" fill="#ededed">Evidência achada, resposta errada</text>
<rect x="240" y="84" width="370" height="16" rx="4" fill="#24262a"/>
<rect x="240" y="84" width="370.0" height="16" rx="4" fill="#16a394"><title>Evidência achada, resposta errada: 27</title></rect>
<text x="622" y="96" font-size="13" font-weight="600" fill="#ededed">27</text>
<text x="228" y="130" font-size="13" text-anchor="end" fill="#ededed">Evidência achada, disse &quot;não há&quot;</text>
<rect x="240" y="118" width="370" height="16" rx="4" fill="#24262a"/>
<rect x="240" y="118" width="123.3" height="16" rx="4" fill="#16a394"><title>Evidência achada, disse &quot;não há&quot;: 9</title></rect>
<text x="622" y="130" font-size="13" font-weight="600" fill="#ededed">9</text>
<text x="228" y="164" font-size="13" text-anchor="end" fill="#ededed">Só parte da evidência achada</text>
<rect x="240" y="152" width="370" height="16" rx="4" fill="#24262a"/>
<rect x="240" y="152" width="82.2" height="16" rx="4" fill="#16a394"><title>Só parte da evidência achada: 6</title></rect>
<text x="622" y="164" font-size="13" font-weight="600" fill="#ededed">6</text>
<text x="228" y="198" font-size="13" text-anchor="end" fill="#ededed">Respondeu uma sem resposta</text>
<rect x="240" y="186" width="370" height="16" rx="4" fill="#24262a"/>
<rect x="240" y="186" width="41.1" height="16" rx="4" fill="#16a394"><title>Respondeu uma sem resposta: 3</title></rect>
<text x="622" y="198" font-size="13" font-weight="600" fill="#ededed">3</text>
<text x="228" y="232" font-size="13" text-anchor="end" fill="#ededed">Evidência nunca achada</text>
<rect x="240" y="220" width="370" height="16" rx="4" fill="#24262a"/>
<rect x="240" y="220" width="13.7" height="16" rx="4" fill="#16a394"><title>Evidência nunca achada: 1</title></rect>
<text x="622" y="232" font-size="13" font-weight="600" fill="#ededed">1</text>
</svg>