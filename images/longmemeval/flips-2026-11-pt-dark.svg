<svg xmlns="http://www.w3.org/2000/svg" width="760" height="262" viewBox="0 0 760 262" font-family="Inter, -apple-system, Segoe UI, sans-serif" role="img" aria-label="O que aconteceu com as 21 falhas da rodada de outubro">
