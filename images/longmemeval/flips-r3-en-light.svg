<svg xmlns="http://www.w3.org/2000/svg" width="760" height="262" viewBox="0 0 760 262" font-family="Inter, -apple-system, Segoe UI, sans-serif" role="img" aria-label="What happened to the 27 second-round misses">
<rect width="760" height="262" fill="#F7F7F5"/>
<text x="24" y="34" font-size="18" font-weight="600" fill="#17171a">What happened to the 27 second-round misses</text>
<text x="24" y="56" font-size="13" fill="#46464e">34 questions were wrong in at least one of the two rounds</text>
<text x="24" y="84" font-size="12" fill="#6b6b74">Second round: 27 misses</text>
<rect x="24" y="92" width="130.0" height="44" rx="5" fill="#0d9488"><title>13 fixed</title></rect><text x="89.0" y="119" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">13 fixed</text>
<rect x="157.0" y="92" width="140.0" height="44" rx="5" fill="#e5533d"><title>14 still wrong</title></rect><text x="227.0" y="119" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">14 still wrong</text>
<text x="24" y="150" font-size="12" fill="#6b6b74">Third round: 21 misses</text>
<rect x="157.0" y="158" width="140.0" height="44" rx="5" fill="#e5533d"><title>14 still wrong</title></rect><text x="227.0" y="185" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">14 still wrong</text>
<rect x="300.0" y="158" width="70.0" height="44" rx="5" fill="#17171a"><title>7 new</title></rect><text x="335.0" y="185" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">7 new</text>
<text x="24" y="234" font-size="12" fill="#46464e">fixed = wrong then, right now · new = right then, wrong now</text>
</svg>
